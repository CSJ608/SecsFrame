name: codeql

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    # GitHub code scanning is unavailable for private repositories without GHAS.
    # Keeping the workflow dormant here makes it take effect automatically if
    # the repository is made public later.
    if: github.event.repository.visibility == 'public'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet build SecsFrame.slnx -c Release
      - uses: github/codeql-action/analyze@v4
