name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            frameworks: "net8.0 net10.0"
          - os: windows-latest
            frameworks: "net48"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build SecsFrame.slnx -c Release
      - name: Test supported projects
        shell: bash
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          for fw in $FRAMEWORKS; do
            dotnet test test/SecsFrame.Tests/SecsFrame.Tests.csproj -c Release --no-build -f "$fw"
            if [ "$fw" != "net48" ]; then
              dotnet test test/SecsFrame.Secs4NetInterop.Tests/SecsFrame.Secs4NetInterop.Tests.csproj -c Release --no-build -f "$fw"
            fi
          done
          if [[ " $FRAMEWORKS " == *" net8.0 "* ]]; then
            dotnet test test/SecsFrame.Demo.Tests/SecsFrame.Demo.Tests.csproj -c Release --no-build
          fi
