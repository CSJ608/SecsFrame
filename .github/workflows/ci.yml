name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            frameworks: "net8.0 net10.0"
          - os: windows-latest
            frameworks: "net48"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Build
        run: dotnet build SecsFrame.slnx -c Release
      - name: Test
        shell: bash
        env:
          FRAMEWORKS: ${{ matrix.frameworks }}
        run: |
          for fw in $FRAMEWORKS; do
            dotnet test SecsFrame.slnx -c Release --no-build -f "$fw"
          done
